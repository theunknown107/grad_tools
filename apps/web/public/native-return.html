<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing you in… · GradTools</title>
    <!--
      Google sign-in in the GradTools Android app ends here, in the browser tab.
      This page does not complete or check the sign-in: Clerk already verified
      it with Google (state and PKCE) on its own servers, and the app reads the
      result from Clerk when it comes back. All this page does is hand the
      student back to the app, through an Android intent that only the
      GradTools package (app.gradtools) can receive. Nothing is read from the
      URL, stored, or forwarded, and the URL's query is wiped from history.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --ink: #111114;
        --muted: #5b5b66;
        --line: rgb(0 0 0 / 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --ink: #f4f4f5;
          --muted: #a1a1aa;
          --line: rgb(255 255 255 / 0.14);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        font-weight: 650;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .ring {
        width: 28px;
        height: 28px;
        margin: 20px auto 14px;
        border: 3px solid var(--line);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation: none;
        }
      }
      p {
        margin: 0;
      }
      .muted {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      a {
        color: inherit;
        font-weight: 600;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">GradTools</div>
      <div class="ring" id="ring" aria-hidden="true"></div>
      <p id="status" role="status">Signing you in…</p>
      <p class="muted" id="help" hidden></p>
    </main>
    <script>
      (function () {
        var failed = new URLSearchParams(location.search).get('handoff') === 'failed';
        // Clerk's parameters are not needed here; keep them out of this tab's history.
        history.replaceState(null, '', location.pathname);

        var status = document.getElementById('status');
        var help = document.getElementById('help');
        var ring = document.getElementById('ring');
        var fallback = location.origin + location.pathname + '?handoff=failed';
        var intent =
          'intent://auth/callback#Intent;scheme=gradtools;package=app.gradtools;' +
          'S.browser_fallback_url=' +
          encodeURIComponent(fallback) +
          ';end';

        function recovery(message) {
          ring.hidden = true;
          status.textContent = message;
          help.hidden = false;
          help.innerHTML = '';
          var link = document.createElement('a');
          link.href = intent;
          link.textContent = 'Open GradTools';
          help.append(link, ' and tap Continue with Google again if you are not signed in.');
        }

        if (!/Android/i.test(navigator.userAgent)) {
          ring.hidden = true;
          status.textContent = 'Finish on your phone';
          help.hidden = false;
          help.textContent = 'Return to the GradTools app to continue.';
          return;
        }
        if (failed) {
          recovery('GradTools did not open.');
          return;
        }
        location.replace(intent);
        // Still here after a few seconds: the hand-off did not happen.
        setTimeout(function () {
          if (document.visibilityState === 'visible') recovery('Still here?');
        }, 4000);
      })();
    </script>
  </body>
</html>
