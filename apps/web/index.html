<!doctype html>
<html lang="en" data-accent="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="GradTools brings routine academic workflows into one place. Independent student project, not affiliated with VTU."
    />
    <title>GradTools</title>
    <!-- The same file the in-app logo inlines; it follows the browser's light/dark. -->
    <link rel="icon" type="image/svg+xml" href="/src/brand/gradtools-mark.svg" />
    <!--
      Fonts ship with the bundle (src/styles/fonts.css); no third-party request.

      Applies the stored appearance BEFORE first paint. The React bundle is a
      deferred module, so a theme applied there would paint once in light and
      then repaint — the flash. This duplicates lib/theme.ts on purpose:
      importing it would make this deferred again.

      Default: LIGHT, accent MONO. `.dark` is the resolved appearance, so
      "system" is decided here too. Silent on failure: the CSS defaults (light)
      stay in charge.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var raw = window.localStorage.getItem('gradtools:v1:theme');
          var saved = raw ? JSON.parse(raw) : {};
          var appearance =
            saved.appearance === 'dark' || saved.appearance === 'system'
              ? saved.appearance
              : 'light';
          var dark =
            appearance === 'dark' ||
            (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          if (appearance !== 'system') root.setAttribute('data-theme', appearance);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var accents = [
            'mono',
            'violet',
            'matrix',
            'crimson',
            'turquoise',
            'ocean',
            'amber',
            'rose',
            'indigo',
            'emerald',
            'solar',
            'slate',
          ];
          var renamed = { cyan: 'turquoise', green: 'emerald' };
          var accent = renamed[saved.accent] || saved.accent;
          root.setAttribute('data-accent', accents.indexOf(accent) !== -1 ? accent : 'mono');
          if (saved.density === 'compact') root.setAttribute('data-density', 'compact');
          if (saved.reducedMotion === true) root.setAttribute('data-motion', 'reduced');
        } catch (error) {
          /* Storage blocked or corrupt: light + mono from the stylesheet. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
