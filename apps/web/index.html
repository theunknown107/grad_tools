<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="GradTools brings routine academic workflows into one place. Independent student project, not affiliated with VTU."
    />
    <title>GradTools</title>
    <!--
      The approved type stack. Preconnected because a webfont that arrives late
      reflows the whole page, and `display=swap` so a slow or absent network
      shows the system fallback immediately rather than invisible text.

      Nothing here is required for the app to work: every stack in tokens.css
      ends in a full system fallback, so a student with no connection gets a
      correctly proportioned interface in a different face.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!--
      Applies the stored theme BEFORE first paint.

      This has to be an inline, blocking script in <head>. The React bundle is a
      module, so it is deferred; if the theme were applied there, the page would
      paint once with the default dark palette and then repaint into light — the
      flash every themed site gets wrong. Everything here is duplicated from
      lib/theme.ts on purpose: importing it would make this deferred again.

      Deliberately silent on failure. A theme that cannot be read is not worth a
      blank page, so any error leaves the CSS defaults in charge, which are the
      system-driven ones.
    -->
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('gradtools:v1:theme');
          if (!raw) return;
          var saved = JSON.parse(raw);
          var root = document.documentElement;
          if (saved.appearance === 'light' || saved.appearance === 'dark') {
            root.setAttribute('data-theme', saved.appearance);
            root.style.colorScheme = saved.appearance;
          }
          if (['violet', 'cyan', 'amber', 'rose', 'green'].indexOf(saved.accent) !== -1) {
            root.setAttribute('data-accent', saved.accent);
          }
        } catch (error) {
          /* Storage blocked or corrupt: fall back to the system appearance. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
